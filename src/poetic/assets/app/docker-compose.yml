services:
  app:
    command: sh -c "pip install poetry && poetry config virtualenvs.create false && poetry install --no-root && alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    image: python:3.12-slim
    ports:
      - 8000:8000
    working_dir: /app
    volumes:
      - .:/app
